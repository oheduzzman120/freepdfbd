<meta name="claude:viewport-fit-sides" content="cover">
<title>FreePdfbd</title>
<style>
  /* Layout: a tool hub — a grid of tool tiles on the home view, a focused single-tool workspace when one is open. */
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #eef0f3;
    --fg: #1a1d24;
    --fg-muted: #5b6472;
    --border: #d9dde3;
    --accent: #c8362f;      /* a warm vermilion red, the PDF-ink hue */
    --accent-ink: #ffffff;
    --accent-soft: #fbe9e7;
    --ok: #2e7d4f;
    --warn: #b4690e;
    --shadow: 0 1px 2px rgba(20,24,33,.06), 0 8px 24px rgba(20,24,33,.06);
    --radius: 14px;
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Inter", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161b;
      --surface: #1d2027;
      --surface-2: #262a32;
      --fg: #eef0f3;
      --fg-muted: #9aa3b0;
      --border: #333843;
      --accent: #f26257;
      --accent-ink: #1a1013;
      --accent-soft: #352120;
      --ok: #5cc98a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161b;
    --surface: #1d2027;
    --surface-2: #262a32;
    --fg: #eef0f3;
    --fg-muted: #9aa3b0;
    --border: #333843;
    --accent: #f26257;
    --accent-ink: #1a1013;
    --accent-soft: #352120;
    --ok: #5cc98a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    line-height: 1.5;
    margin: 0;
  }
  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px 64px;
  }

  /* Header */
  header.app {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .logo {
    width: 40px; height: 40px;
    border-radius: 11px;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid; place-items: center;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 19px;
    flex: none;
    box-shadow: var(--shadow);
  }
  .app h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(22px, 5vw, 28px);
    margin: 0;
    letter-spacing: -.01em;
    text-wrap: balance;
  }
  .app .tag { color: var(--fg-muted); font-size: 13px; margin: 2px 0 0; }
  .theme-btn {
    margin-left: auto;
    flex: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--fg);
    width: 38px; height: 38px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 17px;
    display: grid; place-items: center;
  }
  .theme-btn:hover { border-color: var(--accent); }

  .privacy {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12.5px;
    color: var(--fg-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 999px;
    margin: 14px 0 26px;
  }
  .privacy b { color: var(--ok); font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }

  /* Tool grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 14px;
  }
  .tool {
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
    font: inherit;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 9px;
    transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .tool:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow); }
  .tool:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tool .ico {
    width: 34px; height: 34px;
    border-radius: 9px;
    background: var(--accent-soft);
    color: var(--accent);
    display: grid; place-items: center;
    flex: none;
  }
  .tool .ico svg { width: 19px; height: 19px; }
  .tool .t-name { font-weight: 600; font-size: 15px; }
  .tool .t-desc { font-size: 12.5px; color: var(--fg-muted); line-height: 1.4; }

  /* Workspace */
  #workspace[hidden] { display: none; }
  .ws-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .back {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--fg);
    border-radius: 10px;
    padding: 8px 13px;
    cursor: pointer;
    font: inherit;
    font-size: 13.5px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .back:hover { border-color: var(--accent); }
  .ws-head h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(20px, 4.5vw, 25px);
    margin: 0;
  }
  .ws-desc { color: var(--fg-muted); font-size: 14px; margin: 4px 0 20px; max-width: 60ch; }

  /* Dropzone */
  .drop {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    padding: 34px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop .big { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
  .drop .sub { color: var(--fg-muted); font-size: 13px; }
  .drop svg { width: 34px; height: 34px; color: var(--accent); margin-bottom: 10px; }

  /* File list */
  .files { list-style: none; padding: 0; margin: 18px 0 0; display: flex; flex-direction: column; gap: 9px; }
  .file {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 11px 13px;
  }
  .file .fico { width: 30px; height: 30px; border-radius: 7px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
  .file .fico svg { width: 16px; height: 16px; }
  .file .meta { min-width: 0; flex: 1; }
  .file .fn { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file .fs { font-size: 11.5px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
  .file .handle { cursor: grab; color: var(--fg-muted); padding: 0 2px; user-select: none; }
  .file .rm { border: none; background: none; color: var(--fg-muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 6px; flex: none; }
  .file .rm:hover { color: var(--accent); background: var(--accent-soft); }
  .file.dragging { opacity: .5; }

  /* Controls */
  .panel { margin-top: 20px; display: flex; flex-direction: column; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; font-weight: 600; }
  .field .hint { font-size: 12px; color: var(--fg-muted); }
  .field input[type=text], .field input[type=number], .field select {
    font: inherit; font-size: 14px;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
    color: var(--fg);
    max-width: 100%;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; align-self: flex-start; flex-wrap: wrap; }
  .seg button { border: none; background: var(--surface); color: var(--fg); padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer; border-right: 1px solid var(--border); }
  .seg button:last-child { border-right: none; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }

  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .row .field { flex: 1; min-width: 140px; }

  .go {
    align-self: flex-start;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 11px;
    padding: 12px 26px;
    font: inherit;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .go:hover { filter: brightness(1.05); }
  .go:disabled { opacity: .5; cursor: not-allowed; filter: none; }

  .status { font-size: 13.5px; margin-top: 4px; min-height: 20px; }
  .status.err { color: var(--accent); }
  .status.ok { color: var(--ok); }
  .status.busy { color: var(--fg-muted); }

  /* Results */
  .results { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .result {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 11px 13px;
  }
  .result .meta { flex: 1; min-width: 0; }
  .result .rn { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result .rs { font-size: 11.5px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
  .dl {
    background: var(--ok); color: #fff; border: none; border-radius: 9px;
    padding: 8px 15px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; flex: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .dl:hover { filter: brightness(1.06); }

  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-top: 18px; }
  .thumb { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
  .thumb img { display: block; width: 100%; height: auto; }
  .thumb .cap { font-size: 11.5px; color: var(--fg-muted); padding: 6px 8px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .thumb .cap a { color: var(--accent); font-weight: 600; text-decoration: none; }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } .tool { transition: none; } }

  footer { margin-top: 40px; font-size: 12px; color: var(--fg-muted); text-align: center; line-height: 1.6; }
</style>

<div class="wrap">
  <header class="app">
    <div class="logo">bd</div>
    <div>
      <h1>FreePdfbd</h1>
      <p class="tag">বাংলাদেশের ফ্রি PDF টুল · ফাইল আপনার ব্রাউজারেই থাকে</p>
    </div>
    <button class="theme-btn" id="themeBtn" title="থিম বদলান" aria-label="Toggle theme">◐</button>
  </header>

  <span class="privacy"><span class="dot"></span> <b>১০০% প্রাইভেট</b> — কোনো ফাইল আপলোড হয় না, সব কাজ আপনার ডিভাইসেই</span>

  <!-- HOME -->
  <div id="home">
    <div class="grid" id="toolGrid"></div>
  </div>

  <!-- WORKSPACE -->
  <div id="workspace" hidden>
    <div class="ws-head">
      <button class="back" id="backBtn">‹ সব টুল</button>
      <h2 id="wsTitle"></h2>
    </div>
    <p class="ws-desc" id="wsDesc"></p>

    <input type="file" id="fileInput" hidden multiple>
    <div class="drop" id="drop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-linecap="round"/></svg>
      <div class="big" id="dropBig">ফাইল টেনে আনুন বা বেছে নিন</div>
      <div class="sub" id="dropSub">PDF ফাইল নির্বাচন করুন</div>
    </div>

    <ul class="files" id="fileList"></ul>
    <div class="panel" id="controls"></div>
    <div class="status" id="status"></div>
    <div class="results" id="results"></div>
    <div class="thumbs" id="thumbs"></div>
  </div>

  <footer>
    pdf-lib ও pdf.js দিয়ে তৈরি · সম্পূর্ণ ব্রাউজার-ভিত্তিক প্রসেসিং<br>
    আপনার কোনো ফাইল কখনও কোনো সার্ভারে যায় না
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  "use strict";

  // ---- Theme ----
  var root = document.documentElement;
  var themeBtn = document.getElementById("themeBtn");
  try {
    var saved = localStorage.getItem("pt-theme");
    if (saved) root.setAttribute("data-theme", saved);
  } catch (e) {}
  themeBtn.addEventListener("click", function () {
    var cur = root.getAttribute("data-theme");
    var isDark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    var next = isDark ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("pt-theme", next); } catch (e) {}
  });

  // ---- pdf.js worker ----
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }

  var PDFLib = window.PDFLib;

  // ---- Download helper: use the viewer's downloads capability when present,
  //      fall back to a normal link otherwise ----
  var dlCap = null, dlReady = false;
  if (window.claude && window.claude.use) {
    window.claude.use("downloads").then(function (d) { dlCap = d; dlReady = true; })
      .catch(function () { dlReady = true; });
  } else { dlReady = true; }

  function saveFile(blob, filename, btn) {
    if (dlCap) {
      var orig = btn ? btn.innerHTML : "";
      if (btn) { btn.disabled = true; btn.innerHTML = I.dl + " সেভ হচ্ছে…"; }
      blob.arrayBuffer().then(function (ab) {
        return dlCap.save({ filename: filename, data: ab });
      }).then(function () {
        if (btn) { btn.disabled = false; btn.innerHTML = I.dl + " সেভ হয়েছে ✓"; }
      }).catch(function (err) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = I.dl + (err && err.code === "declined" ? " আবার চেষ্টা" : " ডাউনলোড");
        }
      });
    } else {
      // fallback for contexts where the capability isn't granted
      var url = URL.createObjectURL(blob);
      activeUrls.push(url);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
    }
  }

  // ---- Icons ----
  var I = {
    merge: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/><path d="M11 7h4a2 2 0 0 1 2 2v4" stroke-linecap="round"/></svg>',
    split: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 12h16" stroke-dasharray="2 2"/></svg>',
    compress: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 4v4H4M16 4v4h4M8 20v-4H4M16 20v-4h4"/></svg>',
    rotate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v4h-4"/></svg>',
    jpg2pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m3 17 5-4 4 3 3-2 6 4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    pdf2jpg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6" stroke-linejoin="round"/></svg>',
    pages: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3" stroke-linecap="round"/></svg>',
    numbers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M14 17h3" stroke-linecap="round"/><text x="12" y="13" font-size="7" fill="currentColor" stroke="none" text-anchor="middle" font-family="sans-serif">#</text></svg>',
    file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6" stroke-linejoin="round"/></svg>',
    dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 11l4 4 4-4M5 21h14"/></svg>'
  };

  // ---- Tool definitions ----
  var TOOLS = [
    { id: "merge", name: "Merge PDF", icon: I.merge, accept: ".pdf", multi: true,
      desc: "একাধিক PDF একটি ফাইলে জোড়া লাগান। ড্র্যাগ করে ক্রম বদলান।" },
    { id: "split", name: "Split PDF", icon: I.split, accept: ".pdf", multi: false,
      desc: "নির্দিষ্ট পেজ বের করুন বা প্রতিটি পেজ আলাদা PDF বানান।" },
    { id: "compress", name: "Compress PDF", icon: I.compress, accept: ".pdf", multi: false,
      desc: "ছবি নতুন করে এনকোড করে ফাইলের আকার কমান।" },
    { id: "rotate", name: "Rotate PDF", icon: I.rotate, accept: ".pdf", multi: false,
      desc: "সব পেজ বা নির্দিষ্ট পেজ ৯০°, ১৮০° বা ২৭০° ঘোরান।" },
    { id: "jpg2pdf", name: "Images → PDF", icon: I.jpg2pdf, accept: "image/*", multi: true,
      desc: "JPG বা PNG ছবি থেকে একটি PDF তৈরি করুন।" },
    { id: "pdf2jpg", name: "PDF → JPG", icon: I.pdf2jpg, accept: ".pdf", multi: false,
      desc: "PDF-এর প্রতিটি পেজ উচ্চ-মানের JPG ছবিতে রূপান্তর করুন।" },
    { id: "pages", name: "Organize Pages", icon: I.pages, accept: ".pdf", multi: false,
      desc: "অপ্রয়োজনীয় পেজ মুছুন বা নতুন ক্রমে সাজান।" },
    { id: "numbers", name: "Page Numbers", icon: I.numbers, accept: ".pdf", multi: false,
      desc: "প্রতিটি পেজে পেজ নম্বর যোগ করুন।" }
  ];

  // ---- State ----
  var state = { tool: null, files: [] }; // files: [{file, name, size}]

  // ---- Build home grid ----
  var grid = document.getElementById("toolGrid");
  TOOLS.forEach(function (t) {
    var b = document.createElement("button");
    b.className = "tool";
    b.innerHTML =
      '<span class="ico">' + t.icon + '</span>' +
      '<span class="t-name">' + t.name + '</span>' +
      '<span class="t-desc">' + t.desc + '</span>';
    b.addEventListener("click", function () { openTool(t); });
    grid.appendChild(b);
  });

  // ---- DOM refs ----
  var home = document.getElementById("home");
  var ws = document.getElementById("workspace");
  var wsTitle = document.getElementById("wsTitle");
  var wsDesc = document.getElementById("wsDesc");
  var drop = document.getElementById("drop");
  var dropBig = document.getElementById("dropBig");
  var dropSub = document.getElementById("dropSub");
  var fileInput = document.getElementById("fileInput");
  var fileList = document.getElementById("fileList");
  var controls = document.getElementById("controls");
  var statusEl = document.getElementById("status");
  var resultsEl = document.getElementById("results");
  var thumbsEl = document.getElementById("thumbs");

  document.getElementById("backBtn").addEventListener("click", goHome);

  function goHome() {
    ws.hidden = true;
    home.hidden = false;
    state = { tool: null, files: [] };
    cleanupUrls();
  }

  var activeUrls = [];
  function cleanupUrls() {
    activeUrls.forEach(function (u) { try { URL.revokeObjectURL(u); } catch (e) {} });
    activeUrls = [];
  }

  function openTool(t) {
    state = { tool: t, files: [] };
    home.hidden = true;
    ws.hidden = false;
    wsTitle.textContent = t.name;
    wsDesc.textContent = t.desc;
    fileInput.setAttribute("accept", t.accept);
    if (t.multi) fileInput.setAttribute("multiple", ""); else fileInput.removeAttribute("multiple");
    dropSub.textContent = t.accept === "image/*" ? "JPG বা PNG ছবি নির্বাচন করুন" : (t.multi ? "এক বা একাধিক PDF নির্বাচন করুন" : "একটি PDF নির্বাচন করুন");
    renderFiles();
    renderControls();
    setStatus("");
    resultsEl.innerHTML = "";
    thumbsEl.innerHTML = "";
    cleanupUrls();
    window.scrollTo(0, 0);
  }

  // ---- File input / drop ----
  drop.addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function () { addFiles(fileInput.files); fileInput.value = ""; });
  ["dragenter", "dragover"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("over"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("over"); });
  });
  drop.addEventListener("drop", function (e) {
    if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
  });

  function addFiles(list) {
    var arr = Array.prototype.slice.call(list);
    var t = state.tool;
    arr.forEach(function (f) {
      var isImg = /^image\//.test(f.type);
      var isPdf = /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name);
      if (t.accept === "image/*" && !isImg) return;
      if (t.accept === ".pdf" && !isPdf) return;
      state.files.push({ file: f, name: f.name, size: f.size });
    });
    if (!t.multi && state.files.length > 1) state.files = [state.files[state.files.length - 1]];
    renderFiles();
    renderControls();
    setStatus("");
  }

  function humanSize(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / 1024 / 1024).toFixed(2) + " MB";
  }

  // ---- File list (with drag reorder for merge/images) ----
  var dragIdx = null;
  function renderFiles() {
    fileList.innerHTML = "";
    var reorderable = state.tool && state.tool.multi;
    state.files.forEach(function (item, idx) {
      var li = document.createElement("li");
      li.className = "file";
      li.innerHTML =
        (reorderable ? '<span class="handle" title="টেনে সরান">⋮⋮</span>' : '') +
        '<span class="fico">' + I.file + '</span>' +
        '<span class="meta"><span class="fn"></span><span class="fs">' + humanSize(item.size) + '</span></span>' +
        '<button class="rm" title="সরান">×</button>';
      li.querySelector(".fn").textContent = item.name;
      li.querySelector(".rm").addEventListener("click", function () {
        state.files.splice(idx, 1); renderFiles(); renderControls();
      });
      if (reorderable) {
        li.setAttribute("draggable", "true");
        li.addEventListener("dragstart", function () { dragIdx = idx; li.classList.add("dragging"); });
        li.addEventListener("dragend", function () { dragIdx = null; li.classList.remove("dragging"); });
        li.addEventListener("dragover", function (e) { e.preventDefault(); });
        li.addEventListener("drop", function (e) {
          e.preventDefault();
          if (dragIdx === null || dragIdx === idx) return;
          var moved = state.files.splice(dragIdx, 1)[0];
          state.files.splice(idx, 0, moved);
          renderFiles();
        });
      }
      fileList.appendChild(li);
    });
  }

  // ---- Controls per tool ----
  function renderControls() {
    controls.innerHTML = "";
    if (!state.files.length) return;
    var t = state.tool;
    var frag = document.createDocumentFragment();

    if (t.id === "split") {
      frag.appendChild(field(
        "কোন পেজগুলো?",
        '<input type="text" id="c-range" placeholder="যেমন: 1-3, 5, 8-10" />',
        "খালি রাখলে প্রতিটি পেজ আলাদা PDF হবে। একটি নির্দিষ্ট ক্রম দিলে সেই পেজগুলো নিয়ে একটি নতুন PDF তৈরি হবে।"
      ));
      var mode = segField("আউটপুট", "c-mode", [
        { v: "single", label: "একটি PDF (বাছাই করা পেজ)" },
        { v: "each", label: "প্রতি পেজ আলাদা ফাইল" }
      ], "single");
      frag.appendChild(mode);
    }

    if (t.id === "rotate") {
      frag.appendChild(segField("ঘোরানোর কোণ", "c-angle", [
        { v: "90", label: "৯০° ⟳" }, { v: "180", label: "১৮০°" }, { v: "270", label: "২৭০° ⟲" }
      ], "90"));
      frag.appendChild(field("কোন পেজ?", '<input type="text" id="c-pages" placeholder="খালি = সব পেজ · যেমন: 1,3,5-7" />', ""));
    }

    if (t.id === "pages") {
      frag.appendChild(segField("কাজ", "c-op", [
        { v: "delete", label: "পেজ মুছুন" }, { v: "keep", label: "শুধু এগুলো রাখুন" }, { v: "reorder", label: "নতুন ক্রম" }
      ], "delete"));
      frag.appendChild(field("পেজ তালিকা", '<input type="text" id="c-list" placeholder="যেমন: 2,4  অথবা ক্রম: 3,1,2,4" />',
        "মুছতে/রাখতে: কমা দিয়ে পেজ নম্বর। নতুন ক্রমের জন্য: সব পেজ নতুন সাজানো ক্রমে লিখুন।"));
    }

    if (t.id === "numbers") {
      frag.appendChild(segField("অবস্থান", "c-pos", [
        { v: "bc", label: "নিচে মাঝ" }, { v: "br", label: "নিচে ডান" }, { v: "bl", label: "নিচে বাম" }
      ], "bc"));
      frag.appendChild(field("শুরুর নম্বর", '<input type="number" id="c-start" value="1" min="0" style="max-width:120px" />', ""));
    }

    if (t.id === "compress") {
      frag.appendChild(segField("মান", "c-q", [
        { v: "0.5", label: "সর্বোচ্চ সংকোচন" }, { v: "0.7", label: "ভারসাম্য" }, { v: "0.85", label: "উচ্চ মান" }
      ], "0.7"));
      var note = document.createElement("div");
      note.className = "hint";
      note.style.fontSize = "12px";
      note.textContent = "টেক্সট-ভিত্তিক PDF-এ লাভ কম হয়; ছবিভিত্তিক স্ক্যান করা PDF-এ ভালো কমে।";
      frag.appendChild(note);
    }

    if (t.id === "pdf2jpg") {
      frag.appendChild(segField("রেজোলিউশন", "c-scale", [
        { v: "1", label: "সাধারণ" }, { v: "1.5", label: "উচ্চ" }, { v: "2", label: "সর্বোচ্চ" }
      ], "1.5"));
    }

    controls.appendChild(frag);

    var go = document.createElement("button");
    go.className = "go";
    go.id = "goBtn";
    go.textContent = t.id === "pdf2jpg" ? "ছবিতে রূপান্তর করুন" :
                     t.id === "jpg2pdf" ? "PDF তৈরি করুন" :
                     t.id === "merge" ? "জোড়া লাগান" : "প্রক্রিয়া করুন";
    go.addEventListener("click", run);
    controls.appendChild(go);
  }

  function field(labelText, inner, hint) {
    var d = document.createElement("div");
    d.className = "field";
    d.innerHTML = "<label>" + labelText + "</label>" + inner + (hint ? '<span class="hint">' + hint + "</span>" : "");
    return d;
  }
  function segField(labelText, id, opts, def) {
    var d = document.createElement("div");
    d.className = "field";
    var lab = document.createElement("label"); lab.textContent = labelText; d.appendChild(lab);
    var seg = document.createElement("div"); seg.className = "seg"; seg.id = id; seg.dataset.value = def;
    opts.forEach(function (o) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = o.label; b.dataset.v = o.v;
      if (o.v === def) b.classList.add("on");
      b.addEventListener("click", function () {
        seg.dataset.value = o.v;
        Array.prototype.forEach.call(seg.children, function (c) { c.classList.toggle("on", c === b); });
      });
      seg.appendChild(b);
    });
    d.appendChild(seg);
    return d;
  }
  function segVal(id) { var s = document.getElementById(id); return s ? s.dataset.value : null; }

  function setStatus(msg, cls) {
    statusEl.className = "status" + (cls ? " " + cls : "");
    statusEl.innerHTML = msg;
  }

  // ---- Parse page ranges like "1-3,5,8-10" (1-based) -> array of 0-based indices ----
  function parseRange(str, max) {
    var out = [];
    if (!str || !str.trim()) return null;
    str.split(",").forEach(function (part) {
      part = part.trim();
      if (!part) return;
      var m = part.match(/^(\d+)\s*-\s*(\d+)$/);
      if (m) {
        var a = parseInt(m[1], 10), b = parseInt(m[2], 10);
        if (a > b) { var tmp = a; a = b; b = tmp; }
        for (var i = a; i <= b; i++) if (i >= 1 && i <= max) out.push(i - 1);
      } else if (/^\d+$/.test(part)) {
        var n = parseInt(part, 10);
        if (n >= 1 && n <= max) out.push(n - 1);
      }
    });
    return out;
  }

  function readAB(file) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(r.result); };
      r.onerror = function () { rej(new Error("ফাইল পড়া যায়নি")); };
      r.readAsArrayBuffer(file);
    });
  }

  function makeResult(bytes, filename, mime) {
    var blob = new Blob([bytes], { type: mime || "application/pdf" });
    var row = document.createElement("div");
    row.className = "result";
    row.innerHTML =
      '<span class="fico" style="width:30px;height:30px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none">' + I.file + '</span>' +
      '<span class="meta"><span class="rn"></span><span class="rs">' + humanSize(blob.size) + '</span></span>';
    row.querySelector(".rn").textContent = filename;
    var btn = document.createElement("button");
    btn.className = "dl"; btn.type = "button";
    btn.innerHTML = I.dl + " ডাউনলোড";
    btn.addEventListener("click", function () { saveFile(blob, filename, btn); });
    row.appendChild(btn);
    resultsEl.appendChild(row);
    return blob;
  }

  // ---- Main runner ----
  function run() {
    var go = document.getElementById("goBtn");
    go.disabled = true;
    resultsEl.innerHTML = "";
    thumbsEl.innerHTML = "";
    cleanupUrls();
    setStatus('<span class="spinner"></span>প্রক্রিয়া চলছে…', "busy");

    var t = state.tool;
    var fn = ({
      merge: doMerge, split: doSplit, compress: doCompress, rotate: doRotate,
      jpg2pdf: doImages, pdf2jpg: doPdf2Jpg, pages: doPages, numbers: doNumbers
    })[t.id];

    Promise.resolve().then(fn).then(function (msg) {
      setStatus(msg || "✓ সম্পন্ন!", "ok");
    }).catch(function (err) {
      console.error(err);
      setStatus("✕ " + (err && err.message ? err.message : "একটি সমস্যা হয়েছে"), "err");
    }).then(function () {
      go.disabled = false;
    });
  }

  // ---- Operations ----
  async function doMerge() {
    if (state.files.length < 2) throw new Error("অন্তত দুটি PDF যোগ করুন");
    var out = await PDFLib.PDFDocument.create();
    for (var i = 0; i < state.files.length; i++) {
      var ab = await readAB(state.files[i].file);
      var src = await PDFLib.PDFDocument.load(ab, { ignoreEncryption: true });
      var pages = await out.copyPages(src, src.getPageIndices());
      pages.forEach(function (p) { out.addPage(p); });
    }
    var bytes = await out.save();
    makeResult(bytes, "merged.pdf");
    return "✓ " + state.files.length + "টি ফাইল জোড়া লাগানো হয়েছে";
  }

  async function doSplit() {
    var ab = await readAB(state.files[0].file);
    var src = await PDFLib.PDFDocument.load(ab, { ignoreEncryption: true });
    var total = src.getPageCount();
    var mode = segVal("c-mode");
    var rangeStr = document.getElementById("c-range").value;
    var indices = parseRange(rangeStr, total);

    if (mode === "each" || (!indices && mode !== "single")) {
      var list = indices || src.getPageIndices();
      for (var i = 0; i < list.length; i++) {
        var one = await PDFLib.PDFDocument.create();
        var cp = await one.copyPages(src, [list[i]]);
        one.addPage(cp[0]);
        var b = await one.save();
        makeResult(b, "page-" + (list[i] + 1) + ".pdf");
      }
      return "✓ " + list.length + "টি আলাদা ফাইল তৈরি হয়েছে";
    } else {
      var picks = indices || src.getPageIndices();
      if (!picks.length) throw new Error("বৈধ পেজ পাওয়া যায়নি");
      var out = await PDFLib.PDFDocument.create();
      var cps = await out.copyPages(src, picks);
      cps.forEach(function (p) { out.addPage(p); });
      var by = await out.save();
      makeResult(by, "split.pdf");
      return "✓ " + picks.length + "টি পেজ নিয়ে PDF তৈরি হয়েছে";
    }
  }

  async function doRotate() {
    var ab = await readAB(state.files[0].file);
    var src = await PDFLib.PDFDocument.load(ab, { ignoreEncryption: true });
    var total = src.getPageCount();
    var angle = parseInt(segVal("c-angle"), 10);
    var pagesStr = document.getElementById("c-pages").value;
    var idx = parseRange(pagesStr, total) || src.getPageIndices();
    var pages = src.getPages();
    idx.forEach(function (i) {
      var cur = pages[i].getRotation().angle || 0;
      pages[i].setRotation(PDFLib.degrees((cur + angle) % 360));
    });
    var bytes = await src.save();
    makeResult(bytes, "rotated.pdf");
    return "✓ " + idx.length + "টি পেজ ঘোরানো হয়েছে";
  }

  async function doImages() {
    if (!state.files.length) throw new Error("ছবি যোগ করুন");
    var out = await PDFLib.PDFDocument.create();
    for (var i = 0; i < state.files.length; i++) {
      var f = state.files[i].file;
      var ab = await readAB(f);
      var img, isPng = /png$/i.test(f.type) || /\.png$/i.test(f.name);
      try {
        img = isPng ? await out.embedPng(ab) : await out.embedJpg(ab);
      } catch (e) {
        // fallback: re-encode via canvas to jpeg
        img = await out.embedJpg(await reencodeToJpeg(f));
      }
      var page = out.addPage([img.width, img.height]);
      page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
    }
    var bytes = await out.save();
    makeResult(bytes, "images.pdf");
    return "✓ " + state.files.length + "টি ছবি নিয়ে PDF তৈরি হয়েছে";
  }

  function reencodeToJpeg(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file);
      var im = new Image();
      im.onload = function () {
        var c = document.createElement("canvas");
        c.width = im.naturalWidth; c.height = im.naturalHeight;
        c.getContext("2d").drawImage(im, 0, 0);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) {
          b.arrayBuffer().then(res).catch(rej);
        }, "image/jpeg", 0.92);
      };
      im.onerror = function () { URL.revokeObjectURL(url); rej(new Error("ছবি লোড হয়নি")); };
      im.src = url;
    });
  }

  async function doPages() {
    var ab = await readAB(state.files[0].file);
    var src = await PDFLib.PDFDocument.load(ab, { ignoreEncryption: true });
    var total = src.getPageCount();
    var op = segVal("c-op");
    var listStr = document.getElementById("c-list").value;
    var idx = parseRange(listStr, total);
    if (!idx || !idx.length) throw new Error("পেজ নম্বর লিখুন");

    var finalOrder;
    if (op === "delete") {
      var del = {}; idx.forEach(function (i) { del[i] = true; });
      finalOrder = src.getPageIndices().filter(function (i) { return !del[i]; });
    } else if (op === "keep") {
      finalOrder = idx;
    } else { // reorder
      finalOrder = idx;
    }
    if (!finalOrder.length) throw new Error("সব পেজ বাদ দেওয়া যাবে না");

    var out = await PDFLib.PDFDocument.create();
    var cps = await out.copyPages(src, finalOrder);
    cps.forEach(function (p) { out.addPage(p); });
    var bytes = await out.save();
    makeResult(bytes, op === "delete" ? "pages-removed.pdf" : op === "keep" ? "pages-kept.pdf" : "reordered.pdf");
    return "✓ ফলাফল: " + finalOrder.length + " পেজ";
  }

  async function doNumbers() {
    var ab = await readAB(state.files[0].file);
    var src = await PDFLib.PDFDocument.load(ab, { ignoreEncryption: true });
    var font = await src.embedFont(PDFLib.StandardFonts.Helvetica);
    var pos = segVal("c-pos");
    var start = parseInt(document.getElementById("c-start").value, 10) || 0;
    var pages = src.getPages();
    pages.forEach(function (page, i) {
      var num = String(start + i);
      var size = 11;
      var w = font.widthOfTextAtSize(num, size);
      var pw = page.getWidth();
      var x = pos === "bc" ? (pw - w) / 2 : pos === "br" ? pw - w - 36 : 36;
      page.drawText(num, { x: x, y: 24, size: size, font: font, color: PDFLib.rgb(0.25, 0.25, 0.25) });
    });
    var bytes = await src.save();
    makeResult(bytes, "numbered.pdf");
    return "✓ " + pages.length + "টি পেজে নম্বর যোগ হয়েছে";
  }

  async function doPdf2Jpg() {
    if (!window.pdfjsLib) throw new Error("রেন্ডারার লোড হয়নি");
    var ab = await readAB(state.files[0].file);
    var scale = parseFloat(segVal("c-scale")) || 1.5;
    var pdf = await pdfjsLib.getDocument({ data: ab }).promise;
    var n = pdf.numPages;
    for (var p = 1; p <= n; p++) {
      setStatus('<span class="spinner"></span>পেজ ' + p + " / " + n + " রেন্ডার হচ্ছে…", "busy");
      var page = await pdf.getPage(p);
      var vp = page.getViewport({ scale: scale });
      var canvas = document.createElement("canvas");
      canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      var blob = await new Promise(function (res) { canvas.toBlob(res, "image/jpeg", 0.92); });
      var div = document.createElement("div");
      div.className = "thumb";
      var thumbUrl = canvas.toDataURL("image/jpeg", 0.5);
      div.innerHTML =
        '<img src="' + thumbUrl + '" alt="page ' + p + '">' +
        '<div class="cap"><span>পেজ ' + p + ' · ' + humanSize(blob.size) + '</span></div>';
      var cap = div.querySelector(".cap");
      (function (b, pageNo) {
        var a = document.createElement("a");
        a.href = "#"; a.textContent = "↓ JPG"; a.setAttribute("role", "button");
        a.addEventListener("click", function (ev) { ev.preventDefault(); saveFile(b, "page-" + pageNo + ".jpg"); });
        cap.appendChild(a);
      })(blob, p);
      thumbsEl.appendChild(div);
    }
    return "✓ " + n + "টি পেজ ছবিতে রূপান্তরিত হয়েছে — প্রতিটির নিচে ডাউনলোড লিংক আছে";
  }

  async function doCompress() {
    if (!window.pdfjsLib) throw new Error("রেন্ডারার লোড হয়নি");
    var ab = await readAB(state.files[0].file);
    var origSize = state.files[0].size;
    var q = parseFloat(segVal("c-q")) || 0.7;
    var pdf = await pdfjsLib.getDocument({ data: ab.slice(0) }).promise;
    var n = pdf.numPages;
    var out = await PDFLib.PDFDocument.create();
    // render each page to canvas at moderate scale, embed as jpeg — shrinks image-heavy PDFs
    var scale = q >= 0.85 ? 1.5 : q >= 0.7 ? 1.1 : 0.85;
    for (var p = 1; p <= n; p++) {
      setStatus('<span class="spinner"></span>পেজ ' + p + " / " + n + " সংকুচিত হচ্ছে…", "busy");
      var page = await pdf.getPage(p);
      var vp = page.getViewport({ scale: scale });
      var canvas = document.createElement("canvas");
      canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      var jpegBlob = await new Promise(function (res) { canvas.toBlob(res, "image/jpeg", q); });
      var jpegAb = await jpegBlob.arrayBuffer();
      var img = await out.embedJpg(jpegAb);
      // keep original page aspect at 72dpi points
      var ptW = vp.width / scale, ptH = vp.height / scale;
      var pg = out.addPage([ptW, ptH]);
      pg.drawImage(img, { x: 0, y: 0, width: ptW, height: ptH });
    }
    var bytes = await out.save();
    var blob = makeResult(bytes, "compressed.pdf");
    var pct = Math.round((1 - blob.size / origSize) * 100);
    if (pct > 0) return "✓ আকার " + pct + "% কমেছে (" + humanSize(origSize) + " → " + humanSize(blob.size) + ")";
    return "✓ সম্পন্ন — এই ফাইলে আরও সংকোচন সম্ভব হয়নি (" + humanSize(blob.size) + ")। টেক্সট-ভিত্তিক PDF হলে এটাই স্বাভাবিক।";
  }

})();
